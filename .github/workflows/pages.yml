name: Deploy website

# Publishes the download page in ./website to GitHub Pages.
# One-time setup: in the repository, go to Settings > Pages and set
# "Source" to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once, by hand. Until then, skip the deploy
      # with a clear message instead of failing.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::The website was not deployed. Open Settings > Pages, set Source to GitHub Actions, then re-run this workflow."
          fi

      # Point the download buttons at this repository's releases.
      # Set the repository variable TRIMLY_WEB_APP to change the "Use online" address.
      - name: Write the site settings
        if: steps.pages.outputs.enabled == 'true'
        env:
          REPO: ${{ github.repository }}
          WEB_APP: ${{ vars.TRIMLY_WEB_APP || 'https://trimly-clipy.vercel.app' }}
        run: |
          # Only plain https addresses are accepted, so nothing odd can end up in the script.
          if ! printf '%s' "$WEB_APP" | grep -Eq '^https://[A-Za-z0-9._:/-]+$'; then WEB_APP=""; fi
          printf "window.TRIMLY_REPO = '%s';\nwindow.TRIMLY_WEB_APP = '%s';\n" "$REPO" "$WEB_APP" > website/config.js
          cat website/config.js

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: website

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
