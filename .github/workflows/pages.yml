name: Deploy website

# Publishes the download page in ./website to GitHub Pages.
# One-time setup: in the repository, go to Settings > Pages and set
# "Source" to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Point the download buttons at this repository's releases.
      - name: Set the repository for the download buttons
        env:
          REPO: ${{ github.repository }}
        run: |
          printf "window.TRIMLY_REPO = '%s';\n" "$REPO" > website/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
