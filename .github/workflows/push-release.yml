name: Push Release

# - Pull requests: run the tests only.
# - Push to main: run the tests, build installers for macOS, Windows and Linux,
#   and publish a pre-release tagged v<version>-build.<run number>.
# - Push a v* tag (e.g. v1.0.0): same, but the release uses that tag.
#
# Note: GitHub refuses to let the workflow token create a tag on a commit that
# changes a file under .github/workflows (HTTP 403). A push that edits a
# workflow still tests and builds, but publishes no release.

on:
  push:
    branches: [main]
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  test:
    # A `create` event fires for branches too; only act on v* tags.
    if: github.event_name != 'create' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Frontend tests
        run: npm test -- --watch=false

      - name: Frontend production build
        run: npm run build

      - name: Install Linux system libraries
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y $LINUX_DEPS && break
            echo "apt failed (attempt $attempt), retrying..."; sleep 10
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (engine, server and desktop app)
        run: cargo test --workspace

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows
            os: windows-latest
            target: ""
            bundles: nsis
          - name: linux
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y $LINUX_DEPS && break
            echo "apt failed (attempt $attempt), retrying..."; sleep 10
          done

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          npx --yes @tauri-apps/cli@2 build "${args[@]}"

      # macOS builds are unsigned. Users open them with right-click > Open,
      # or run: xattr -dr com.apple.quarantine /Applications/Trimly.app
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage

  release:
    needs: [test, build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'create' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-*
          path: dist-release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers found to publish." >&2
            exit 1
          fi
          printf 'Publishing:\n'; printf ' - %s\n' "${files[@]}"

          notes="Trimly needs yt-dlp and ffmpeg installed on your computer. macOS builds are unsigned: right-click the app and choose Open the first time."

          if [ "$EVENT_NAME" = "create" ]; then
            tag="$REF_NAME"
            extra=(--verify-tag)
          else
            version="$(node -p "require('./package.json').version")"
            tag="v${version}-build.${RUN_NUMBER}"
            extra=(--target "$GITHUB_SHA" --prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Trimly $tag" \
              --generate-notes --notes "$notes" \
              "${extra[@]}"
          fi
