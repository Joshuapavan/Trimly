name: Docker image

# Builds the Trimly web server image (server + web app + yt-dlp + ffmpeg).
# Pull requests only check that it builds. Pushes to main and v* tags publish
# it to the GitHub Container Registry as ghcr.io/<owner>/<repo>.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - server/**
      - crates/**
      - src-tauri/Cargo.toml
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - angular.json
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - server/**
      - crates/**
      - src/**
      - public/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
