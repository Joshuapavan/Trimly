<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trimly</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paste a video link, choose a start and end, and download only that clip. Crop for Reels, queue several clips, and pause or resume.">
  <meta name="theme-color" content="#c2410c">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trimly">
  <meta property="og:title" content="Trimly: download just the part of a video you want">
  <meta property="og:description" content="Paste a video link, choose a start and end, and download only that clip.">
  <meta property="og:image" content="https://trimly-clipy.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://trimly-clipy.vercel.app/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script src="config.js"></script>
  <script>
    try {
      var t = localStorage.getItem('trimly.theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
