[package]
name = "trimly-server"
version = "0.1.0"
description = "Web server for Trimly: the same engine as the desktop app, behind an HTTP API"
edition = "2021"

[dependencies]
trimly-engine = { path = "../crates/engine" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
