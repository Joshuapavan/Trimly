[package]
name = "trimly-engine"
version = "0.1.0"
description = "Downloads just the chosen part of a video, with yt-dlp and ffmpeg"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
